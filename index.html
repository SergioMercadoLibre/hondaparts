<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honda Catalogador | Precisión Absoluta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
      { "imports": { "@google/generative-ai": "https://esm.run/@google/generative-ai" } }
    </script>
</head>
<body class="bg-slate-100 p-4 md:p-8 font-sans">

    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg border-t-4 border-black overflow-hidden">
        
        <div class="bg-black text-white p-6">
            <h1 class="text-3xl font-bold uppercase italic tracking-tighter">Honda Part Intel Pro</h1>
            <p class="text-xs opacity-90 text-red-400 font-bold tracking-widest uppercase">Motor Analítico: Catálogo EPC Global Restringido</p>
        </div>

        <div class="p-6 space-y-6">
            
            <div class="bg-gray-50 p-4 rounded border border-gray-200">
                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase">1. Tu API Key:</label>
                <input type="password" id="apiKey" placeholder="AIzaSy..." class="w-full p-2 border rounded focus:border-black outline-none text-sm font-mono">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase">2. Código Original Honda (Base 9 dígitos o completo):</label>
                <div class="flex flex-col sm:flex-row gap-2">
                    <input type="text" id="partInput" placeholder="Ej: 90087-KT7-000 o 51490-MN8" class="flex-1 p-4 border-2 border-gray-300 rounded text-xl font-bold uppercase focus:border-red-600 outline-none">
                    <button id="mainBtn" onclick="procesar()" class="bg-red-600 text-white px-8 py-3 rounded font-bold uppercase hover:bg-red-700 transition disabled:bg-gray-400 shadow-md">
                        Analizar Pieza
                    </button>
                </div>
            </div>

            <div id="statusBox" class="hidden p-4 rounded text-sm font-bold text-center"></div>

            <div id="resultBox" class="hidden animate-in fade-in duration-500">
                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase">Publicación y Ficha Técnica:</label>
                <textarea id="output" rows="25" class="w-full p-5 bg-gray-50 border rounded font-mono text-sm outline-none shadow-inner leading-relaxed text-gray-800"></textarea>
                <button onclick="copiar()" class="mt-4 w-full bg-blue-600 text-white py-4 rounded font-bold uppercase hover:bg-blue-700 transition shadow-lg flex justify-center items-center gap-2">
                    📋 Copiar Formato ML
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "@google/generative-ai";

        document.getElementById('apiKey').value = localStorage.getItem('honda_key_auto') || '';

        window.procesar = async () => {
            const key = document.getElementById('apiKey').value.trim();
            const part = document.getElementById('partInput').value.trim();
            
            if(!key) return alert("Por favor, ingresá tu API Key.");
            if(part.length < 5) return alert("El código es muy corto.");

            localStorage.setItem('honda_key_auto', key);

            const btn = document.getElementById('mainBtn');
            const status = document.getElementById('statusBox');
            const result = document.getElementById('resultBox');
            const output = document.getElementById('output');

            btn.disabled = true;
            result.classList.add('hidden');
            status.classList.remove('hidden', 'bg-red-100', 'text-red-700');
            status.classList.add('bg-blue-100', 'text-blue-700');
            
            try {
                status.innerText = "Conectando al servidor y validando motor...";
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
                const data = await response.json();
                if (data.error) throw new Error(data.error.message);

                const validModels = data.models.filter(m => m.supportedGenerationMethods.includes("generateContent") && m.name.includes("gemini"));
                const selectedModel = validModels.find(m => m.name.includes("flash")) || validModels[0];
                const cleanModelName = selectedModel.name.replace('models/', '');

                status.innerText = `Analizando EPC Global y cruzando datos de manuales para código ${part}...`;

                const genAI = new GoogleGenerativeAI(key);
                const model = genAI.getGenerativeModel({ model: cleanModelName });
                
                // PROMPT ULTRA-ESTRICTO PARA EVITAR ALUCINACIONES Y ASEGURAR FORMATO
                const prompt = `Eres un experto técnico en catálogos de repuestos de Honda Motor Co. (EPC Global, USA, Europa, Brasil, Argentina).
                REGLA DE ORO: NO INVENTES DATOS. NO ALUCINES. Si la pieza es un tapón de alternador de 30mm, no digas que es un tornillo. Si es un retén de 41mm, no digas que es de 39mm.
                
                Código ingresado por el usuario: "${part}"

                INSTRUCCIONES LÓGICAS OBLIGATORIAS:
                1. Completar: Si el código tiene 9 dígitos, COMPLETA el código original oficial con su terminación.
                2. Reemplazos: Busca si existe un reemplazo oficial / supersession.
                3. Formato de Años: Los años DEBEN estar separados estrictamente por un guion (-) y NUNCA por comas (,). Ejemplo correcto: 2002-2015.

                GENERA LA SALIDA EXACTAMENTE CON ESTA ESTRUCTURA (No agregues introducciones ni saludos):

                [NOMBRE DEL ARTÍCULO EN MAYÚSCULAS]
                [MODELOS MÁS COMERCIALES PARA ARGENTINA / BRASIL]
                [QUÉ ES Y QUÉ INCLUYE] - [DESTACAR CALIDAD ORIGINAL HONDA]
                HONDA ORIGINAL

                --- CÓDIGO ORIGINAL HONDA ---
                CÓDIGO: [Código Completo]
                (Lista de motos que lo llevan por manual)
                PARA: [Modelo]
                AÑOS: [Año]-[Año]
                (Repetir formato PARA/AÑOS por cada moto)

                --- REEMPLAZO OFICIAL HONDA ---
                CÓDIGO: [Código de Reemplazo o "No posee reemplazo oficial"]
                (Si posee reemplazo, lista las motos que lo llevan)
                PARA: [Modelo]
                AÑOS: [Año]-[Año]

                --- COMPATIBILIDADES FÍSICAS HONDA ---
                (Otros códigos de Honda que sean la misma pieza física y sirvan como alternativa. Si no hay, pon "No registra".)

                --- COMPATIBILIDAD CON OTRAS MARCAS ---
                (Si la pieza sirve para motos Yamaha, Kawasaki, Suzuki, BMW, etc.)
                MARCA: [Marca]
                CÓDIGO OEM: [Código de la otra marca]
                PARA: [Modelo]
                AÑOS: [Año]-[Año]`;

                const res = await model.generateContent(prompt);
                
                output.value = res.response.text();
                status.classList.add('hidden');
                result.classList.remove('hidden');

            } catch (err) {
                status.classList.remove('bg-blue-100', 'text-blue-700');
                status.classList.add('bg-red-100', 'text-red-700');
                status.innerHTML = "<b>Error:</b> " + err.message;
            } finally {
                btn.disabled = false;
                btn.innerText = "Analizar Pieza";
            }
        };

        window.copiar = () => {
            const out = document.getElementById("output");
            out.select();
            document.execCommand("copy");
            alert("¡Copiado al portapapeles con éxito!");
        };
    </script>
</body>
</html>
