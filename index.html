<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honda Catalogador | Auto-Configurable</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
      { "imports": { "@google/generative-ai": "https://esm.run/@google/generative-ai" } }
    </script>
</head>
<body class="bg-slate-100 p-4 md:p-8 font-sans">

    <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-lg border-t-4 border-black overflow-hidden">
        
        <div class="bg-black text-white p-6">
            <h1 class="text-2xl font-bold uppercase italic">Honda Part Intel</h1>
            <p class="text-xs opacity-90 text-red-400 font-bold tracking-widest uppercase">Sistema de Detección Automática de Motor</p>
        </div>

        <div class="p-6 space-y-6">
            
            <div class="bg-gray-50 p-4 rounded border border-gray-200">
                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase">1. Tu API Key (Nueva):</label>
                <input type="password" id="apiKey" placeholder="AIzaSy..." class="w-full p-2 border rounded focus:border-black outline-none text-sm font-mono">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase">2. Código Original Honda (Mínimo 5 dígitos):</label>
                <div class="flex flex-col sm:flex-row gap-2">
                    <input type="text" id="partInput" placeholder="Ej: 51490-MN8" class="flex-1 p-3 border-2 border-gray-300 rounded text-xl font-bold uppercase focus:border-red-600 outline-none">
                    <button id="mainBtn" onclick="procesar()" class="bg-red-600 text-white px-8 py-3 rounded font-bold uppercase hover:bg-red-700 transition disabled:bg-gray-400 shadow-md">
                        Generar
                    </button>
                </div>
            </div>

            <div id="statusBox" class="hidden p-4 rounded text-sm font-bold text-center"></div>

            <div id="resultBox" class="hidden">
                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase">Descripción Estandarizada:</label>
                <textarea id="output" rows="15" class="w-full p-4 bg-gray-50 border rounded font-mono text-sm outline-none shadow-inner"></textarea>
                <button onclick="copiar()" class="mt-2 w-full bg-blue-600 text-white py-4 rounded font-bold uppercase hover:bg-blue-700 transition shadow-lg">
                    📋 Copiar al Portapapeles
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "@google/generative-ai";

        document.getElementById('apiKey').value = localStorage.getItem('honda_key_auto') || '';

        window.procesar = async () => {
            const key = document.getElementById('apiKey').value.trim();
            const part = document.getElementById('partInput').value.trim();
            
            if(!key) return alert("Por favor, ingresá tu API Key.");
            if(part.length < 5) return alert("El código es muy corto.");

            localStorage.setItem('honda_key_auto', key);

            const btn = document.getElementById('mainBtn');
            const status = document.getElementById('statusBox');
            const result = document.getElementById('resultBox');
            const output = document.getElementById('output');

            btn.disabled = true;
            result.classList.add('hidden');
            status.classList.remove('hidden', 'bg-red-100', 'text-red-700');
            status.classList.add('bg-blue-100', 'text-blue-700');
            
            try {
                // PASO 1: Descubrir modelos habilitados para esta llave específica
                status.innerText = "1/2 Verificando conexión y motores habilitados en tu cuenta...";
                
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
                const data = await response.json();

                if (data.error) throw new Error(data.error.message);

                // Filtrar solo los modelos que sirven para generar texto
                const validModels = data.models.filter(m => m.supportedGenerationMethods.includes("generateContent") && m.name.includes("gemini"));
                
                if (validModels.length === 0) throw new Error("Tu cuenta no tiene modelos de IA habilitados para generar texto.");

                // Seleccionar automáticamente el mejor disponible (Flash es más rápido/barato, Pro es respaldo)
                const selectedModel = validModels.find(m => m.name.includes("flash")) || validModels[0];
                const cleanModelName = selectedModel.name.replace('models/', '');

                // PASO 2: Generar contenido con el modelo detectado
                status.innerText = `2/2 Motor detectado exitosamente: [${cleanModelName}]. Analizando repuesto Honda...`;

                const genAI = new GoogleGenerativeAI(key);
                const model = genAI.getGenerativeModel({ model: cleanModelName });
                
                const prompt = `Actúa como un catálogo experto en repuestos Honda. Código: ${part}. 
                Si es base de 9 dígitos, identifica reemplazos.
                Formato estricto para Mercado Libre:
                1. NOMBRE ARTÍCULO (MAYÚSCULAS)
                2. MODELOS PRINCIPALES (ARG/BRA)
                3. JUEGO DE... (DETALLE Y ORIGINALIDAD HONDA)
                4. HONDA ORIGINAL
                5. Lista: PARA: [Modelo] AÑOS: [Rango]
                Usa datos oficiales. Compatibilidad otras marcas al final.`;

                const res = await model.generateContent(prompt);
                
                output.value = res.response.text();
                status.classList.add('hidden');
                result.classList.remove('hidden');

            } catch (err) {
                status.classList.remove('bg-blue-100', 'text-blue-700');
                status.classList.add('bg-red-100', 'text-red-700');
                
                if (err.message.includes("quota") || err.message.includes("429")) {
                    status.innerHTML = "🛑 <b>LÍMITE DE CUOTA:</b> Facturación de Google Cloud no activa o límite diario alcanzado.";
                } else {
                    status.innerHTML = "<b>Error:</b> " + err.message;
                }
            } finally {
                btn.disabled = false;
                btn.innerText = "Generar";
            }
        };

        window.copiar = () => {
            const out = document.getElementById("output");
            out.select();
            document.execCommand("copy");
            alert("¡Copiado al portapapeles!");
        };
    </script>
</body>
</html>
