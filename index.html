<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honda Catalogador | Modo Exhaustivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
      { "imports": { "@google/generative-ai": "https://esm.run/@google/generative-ai" } }
    </script>
</head>
<body class="bg-slate-100 p-4 md:p-8 font-sans">

    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-2xl border-t-4 border-red-600 overflow-hidden">
        
        <div class="bg-red-600 text-white p-6">
            <h1 class="text-3xl font-bold uppercase italic tracking-tighter">Honda Part Intel Pro</h1>
            <p class="text-xs opacity-90 text-white font-bold tracking-widest uppercase">Motor Comercial: Listados Exhaustivos y Tips de Venta</p>
        </div>

        <div class="p-6 space-y-6">
            
            <div class="bg-gray-50 p-4 rounded border border-gray-200">
                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase">1. Tu API Key:</label>
                <input type="password" id="apiKey" placeholder="AIzaSy..." class="w-full p-2 border rounded focus:border-red-600 outline-none text-sm font-mono">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase">2. Código Original Honda (Base 9 dígitos o completo):</label>
                <div class="flex flex-col sm:flex-row gap-2">
                    <input type="text" id="partInput" placeholder="Ej: 51490-MN8 o 90087-KT7-000" class="flex-1 p-4 border-2 border-gray-300 rounded text-xl font-bold uppercase focus:border-red-600 outline-none">
                    <button id="mainBtn" onclick="procesar()" class="bg-black text-white px-8 py-3 rounded font-bold uppercase hover:bg-gray-800 transition disabled:bg-gray-400 shadow-md">
                        Analizar Pieza
                    </button>
                </div>
            </div>

            <div id="statusBox" class="hidden p-4 rounded text-sm font-bold text-center"></div>

            <div id="resultBox" class="hidden animate-in fade-in duration-500">
                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase">Publicación Profesional para ML:</label>
                <textarea id="output" rows="30" class="w-full p-5 bg-gray-50 border rounded font-mono text-sm outline-none shadow-inner leading-relaxed text-gray-800"></textarea>
                <button onclick="copiar()" class="mt-4 w-full bg-red-600 text-white py-4 rounded font-bold uppercase hover:bg-red-700 transition shadow-lg flex justify-center items-center gap-2">
                    📋 Copiar Publicación Completa
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "@google/generative-ai";

        document.getElementById('apiKey').value = localStorage.getItem('honda_key_auto') || '';

        window.procesar = async () => {
            const key = document.getElementById('apiKey').value.trim();
            const part = document.getElementById('partInput').value.trim();
            
            if(!key) return alert("Por favor, ingresá tu API Key.");
            if(part.length < 5) return alert("El código es muy corto.");

            localStorage.setItem('honda_key_auto', key);

            const btn = document.getElementById('mainBtn');
            const status = document.getElementById('statusBox');
            const result = document.getElementById('resultBox');
            const output = document.getElementById('output');

            btn.disabled = true;
            result.classList.add('hidden');
            status.classList.remove('hidden', 'bg-red-100', 'text-red-700');
            status.classList.add('bg-blue-100', 'text-blue-700');
            
            try {
                status.innerText = "Conectando al servidor y validando motor...";
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
                const data = await response.json();
                if (data.error) throw new Error(data.error.message);

                const validModels = data.models.filter(m => m.supportedGenerationMethods.includes("generateContent") && m.name.includes("gemini"));
                const selectedModel = validModels.find(m => m.name.includes("flash")) || validModels[0];
                const cleanModelName = selectedModel.name.replace('models/', '');

                status.innerText = `Buscando en catálogo global para ${part}. Extrayendo TODOS los modelos sin omitir...`;

                const genAI = new GoogleGenerativeAI(key);
                const model = genAI.getGenerativeModel({ model: cleanModelName });
                
                const prompt = `Actúa como el experto número uno en repuestos Honda. Código a consultar: "${part}".

                REGLAS ESTRICTAS DE EXTRACCIÓN Y FORMATO:
                1. PRECISIÓN TÉCNICA: Verifica las medidas exactas y qué pieza es antes de escribir. (Ej: 90087-KT7-000 es un tapón de alternador de aluminio de 30mm, no un tornillo. 51490-MN8-305 es un retén de 41x54x11). NO ALUCINES.
                2. CÓDIGO COMPLETO Y REEMPLAZOS: Si el usuario da 9 dígitos, completa la terminación original. Revisa si hay "Supersession" (Reemplazo oficial).
                3. LISTADO EXHAUSTIVO: PROHIBIDO RESUMIR. Debes listar TODAS las motos (Global, USA, Europa, LATAM) que lleven la pieza.
                4. FORMATO DE AÑOS: Los años deben ir SEPARADOS POR GUION (Ej: 2002-2015), NUNCA por comas.

                TU RESPUESTA DEBE SER EXACTAMENTE ESTA PLANTILLA, COMPLETANDO LOS DATOS:

                [NOMBRE DEL ARTÍCULO EN MAYÚSCULAS]
                [MODELOS MÁS COMERCIALES PARA ARGENTINA / BRASIL]
                [JUEGO DE... INDICAR QUÉ INCLUYE Y DESTACAR CALIDAD ORIGINAL HONDA]
                HONDA ORIGINAL

                --- CÓDIGO Y REEMPLAZOS ---
                CÓDIGO ORIGINAL: [Código completo de 10 u 11 dígitos]
                REEMPLAZO OFICIAL: [Indicar el código si hay reemplazo, o "No registra reemplazo oficial"]

                --- LISTADO DE APLICACIÓN (HONDA) ---
                (Lista exhaustiva de TODAS las motos que lo usan por manual. Un modelo por bloque.)
                PARA: [Modelo]
                AÑOS: [Año]-[Año]
                
                PARA: [Siguiente Modelo]
                AÑOS: [Año]-[Año]
                (Repetir hasta agotar todas las motos)

                💡 TIPS DE VENTA PROFESIONAL (INSIGHT DE MERCADO)
                [Agrega 2 o 3 tips de venta. Ejemplo: Nombres alternativos en USA como 'Honda 599', medidas exactas críticas como '41x54x11', o datos sobre la resistencia del repuesto aplicable a motos pesadas como Gold Wing].

                --- COMPATIBILIDAD CON OTRAS MARCAS (PUBLICACIÓN ALTERNATIVA) ---
                (Indica si esta pieza sirve para otras marcas por tener idéntica medida o especificación física)
                [Marca] [Modelo]: [Año]-[Año] (Código OEM: [Si lo sabes])`;

                const res = await model.generateContent(prompt);
                
                output.value = res.response.text();
                status.classList.add('hidden');
                result.classList.remove('hidden');

            } catch (err) {
                status.classList.remove('bg-blue-100', 'text-blue-700');
                status.classList.add('bg-red-100', 'text-red-700');
                status.innerHTML = "<b>Error:</b> " + err.message;
            } finally {
                btn.disabled = false;
                btn.innerText = "Analizar Pieza";
            }
        };

        window.copiar = () => {
            const out = document.getElementById("output");
            out.select();
            document.execCommand("copy");
            alert("¡Copiado al portapapeles con éxito!");
        };
    </script>
</body>
</html>
