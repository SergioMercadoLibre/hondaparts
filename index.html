<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honda Part Intel Pro | 2026 Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
      { "imports": { "@google/generative-ai": "https://esm.run/@google/generative-ai" } }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Oswald:wght@500;700&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #f8fafc; }
        .honda-header { font-family: 'Oswald', sans-serif; background: linear-gradient(90deg, #b91c1c 0%, #ef4444 100%); }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .btn-honda { background: #e11d48; transition: all 0.3s ease; }
        .btn-honda:hover { background: #fb7185; transform: translateY(-2px); box-shadow: 0 4px 15px rgba(225, 29, 72, 0.4); }
    </style>
</head>
<body class="min-h-screen pb-10">

    <header class="honda-header p-6 shadow-2xl mb-8">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold tracking-tighter italic text-white uppercase text-left">Honda Part Intel Pro</h1>
                <p class="text-[10px] font-bold text-red-100 tracking-[0.2em] uppercase opacity-80 text-left">Sistema Profesional de Repuestos 2026</p>
            </div>
            <button onclick="document.getElementById('config').classList.toggle('hidden')" class="bg-black/30 hover:bg-black/50 p-3 rounded-full transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 text-left">
        <div id="config" class="hidden mb-6 p-6 glass rounded-3xl">
            <h3 class="text-sm font-bold text-red-400 mb-4 uppercase tracking-wider">Configuración de Seguridad API</h3>
            <input type="password" id="apiKey" placeholder="Pegá tu API Key de Google acá" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white text-sm focus:border-red-500 outline-none">
            <button onclick="saveKey()" class="mt-3 w-full bg-slate-100 text-black font-bold p-3 rounded-xl text-xs hover:bg-white transition">GUARDAR CLAVE</button>
        </div>

        <div class="glass p-8 rounded-[2rem] shadow-inner">
            <div class="flex flex-col md:flex-row gap-4">
                <div class="flex-1 text-left">
                    <label class="block text-[10px] font-bold text-slate-400 mb-2 uppercase tracking-widest text-left">Código Original (Base o Completo)</label>
                    <input type="text" id="partInput" placeholder="Ej: 51490-MN8" class="w-full bg-slate-900 border-2 border-slate-700 p-4 rounded-2xl text-2xl font-bold uppercase tracking-widest text-white focus:border-red-500 transition-all outline-none">
                </div>
                <div class="flex items-end">
                    <button id="mainBtn" onclick="processPart()" class="btn-honda w-full md:w-auto px-10 py-5 rounded-2xl font-bold text-lg uppercase tracking-tighter italic text-white shadow-lg shadow-red-900/20">Analizar Pieza</button>
                </div>
            </div>

            <div id="loader" class="hidden mt-10 text-center">
                <div class="inline-block w-12 h-12 border-4 border-red-500 border-t-transparent rounded-full animate-spin"></div>
                <p class="text-xs font-bold text-slate-500 mt-4 uppercase tracking-[0.3em]">IA Conectando con Bases de Datos Honda...</p>
            </div>

            <div id="result" class="hidden mt-10">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-xs font-bold text-red-400 uppercase tracking-widest italic">Descripción Lista para Mercado Libre</span>
                    <button onclick="copyText()" class="text-[10px] bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-full font-bold uppercase transition text-white">Copiar Todo</button>
                </div>
                <textarea id="output" rows="18" class="w-full bg-slate-900/50 border border-slate-700 p-6 rounded-3xl text-sm font-mono text-slate-300 leading-relaxed shadow-inner outline-none"></textarea>
            </div>
        </div>
    </main>

    <script type="module">
        import { GoogleGenerativeAI } from "@google/generative-ai";

        window.saveKey = () => {
            const key = document.getElementById('apiKey').value;
            localStorage.setItem('honda_pro_key', key);
            alert("Clave guardada exitosamente.");
            document.getElementById('config').classList.add('hidden');
        };

        window.processPart = async () => {
            const key = localStorage.getItem('honda_pro_key');
            const part = document.getElementById('partInput').value.trim();
            
            if(!key) return alert("Hacé clic en el engranaje de arriba y poné tu API Key primero.");
            if(part.length < 5) return alert("Ingresá un código válido.");

            const btn = document.getElementById('mainBtn');
            const loader = document.getElementById('loader');
            const result = document.getElementById('result');
            const output = document.getElementById('output');

            btn.disabled = true;
            loader.classList.remove('hidden');
            result.classList.add('hidden');

            try {
                const genAI = new GoogleGenerativeAI(key);
                // MODELO CORREGIDO PARA 2026: gemini-2.0-flash
                const model = genAI.getGenerativeModel({ model: "gemini-2.0-flash" });
                
                const prompt = `Como experto en repuestos Honda, analiza: "${part}". 
                Si es una base de 9 dígitos, identifica terminaciones y reemplazos oficiales.
                Genera la descripción para Mercado Libre:
                Línea 1: NOMBRE DEL ARTÍCULO (MAYÚSCULAS)
                Línea 2: MODELOS LÍDERES (ARG/BRA/USA)
                Línea 3: JUEGO DE... (DETALLE E IMPORTANCIA DE ORIGINALIDAD HONDA)
                Línea 4: HONDA ORIGINAL
                Línea 5 en adelante: Listado "PARA: [Modelo] AÑOS: [Rango]"
                
                Usa datos de manuales oficiales. Si aplica a otras marcas por medida, indícalo al final separado por guiones.`;

                const res = await model.generateContent(prompt);
                output.value = res.response.text();
                result.classList.remove('hidden');
            } catch (err) {
                if(err.message.includes("429")) {
                    alert("Límite de velocidad. Esperá 1 minuto y probá de nuevo (límite del plan gratis).");
                } else if(err.message.includes("404")) {
                    alert("Error interno de Google (404). El servidor de IA está en mantenimiento. Probá en unos minutos.");
                } else {
                    alert("Error técnico: " + err.message);
                }
            } finally {
                btn.disabled = false;
                loader.classList.add('hidden');
            }
        };

        window.copyText = () => {
            const copyText = document.getElementById("output");
            copyText.select();
            document.execCommand("copy");
            alert("Copiado al portapapeles.");
        };
    </script>
</body>
</html>
